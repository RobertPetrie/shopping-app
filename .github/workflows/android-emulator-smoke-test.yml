name: Test Android Emulator

# This can still be run manually on any branch, and the main build pipeline
# also calls it automatically after a successful Windows build on main.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android-emulator-smoke-test:
    name: Launch app in Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v5

      # GitHub's Ubuntu runner exposes /dev/kvm, but the runner user needs
      # permission to use it. Without this, the Android emulator falls back
      # to painfully slow software emulation and can lose its ADB connection.
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android dependencies
        run: >
          dotnet restore shopping-app.csproj
          -p:TargetFrameworks=net10.0-android

      - name: Build debug APK for emulator smoke test
        run: >
          dotnet publish shopping-app.csproj
          --configuration Debug
          --framework net10.0-android
          -p:TargetFrameworks=net10.0-android
          -p:AndroidPackageFormats=apk
          -p:AndroidEnableFastDeployment=false
          -p:EmbedAssembliesIntoApk=true
          --no-restore

      - name: Prepare APK path
        shell: bash
        run: |
          APK_PATH="$(find bin/Debug/net10.0-android -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced."
            find bin/Debug/net10.0-android -type f -name '*.apk' -print || true
            find bin/Release/net10.0-android -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Using APK: $APK_PATH"

      # android-emulator-runner executes each line of its "script" input as a
      # separate shell command. Put the real smoke test in one Bash script so
      # variables, if/else blocks, and exit handling all stay in one shell.
      - name: Prepare emulator smoke-test script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/android-emulator-smoke-test.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          APK_PATH="$1"
          RESULTS_DIR="android-emulator-results"
          PACKAGE_ID="com.companyname.shoppingapp"
          APP_DEBUG_LOG="files/DebugData/debug.log"

          mkdir -p "$RESULTS_DIR"

          echo "Ensuring adb daemon is running..."
          adb kill-server || true
          adb start-server || true

          echo "Waiting for emulator ADB to be fully ready..."
          adb wait-for-device

          echo "Waiting for emulator device to be online..."
          until adb devices | grep -q "emulator-5554\s*device"; do
            echo "Waiting for emulator device to be online..."
            sleep 2
          done

          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            echo "Waiting for Android boot to complete..."
            sleep 2
          done

          echo "Installing APK..."
          adb install -r "$APK_PATH"

          adb logcat -c

          echo "Launching shopping app..."
          adb shell am force-stop "$PACKAGE_ID"

          MAIN_ACTIVITY="$(adb shell cmd package resolve-activity --brief "$PACKAGE_ID" 2>/dev/null | tail -n 1 | tr -d '\r')"
          if [ -n "$MAIN_ACTIVITY" ]; then
            echo "Starting resolved launcher activity: $MAIN_ACTIVITY"
            adb shell am start -n "$MAIN_ACTIVITY" || true
          else
            echo "Main activity not resolved; falling back to monkey launcher."
            adb shell monkey -p "$PACKAGE_ID" -c android.intent.category.LAUNCHER 1 || true
          fi

          sleep 40

          echo "Capturing emulator screenshot..."
          adb exec-out screencap -p > "$RESULTS_DIR/app-after-launch.png" || true

          echo "Capturing Android logs..."
          adb logcat -d > "$RESULTS_DIR/logcat.txt" || true

          echo "Capturing process list..."
          adb shell ps -A > "$RESULTS_DIR/process-list.txt" || true

          echo "Capturing package state..."
          adb shell dumpsys package "$PACKAGE_ID" > "$RESULTS_DIR/package-dumpsys.txt" || true

          echo "Capturing activity state..."
          adb shell dumpsys activity activities 2>/dev/null | sed -n '1,200p' > "$RESULTS_DIR/dumpsys-activities-head.txt" || true

          echo "Capturing the app's own debug.log..."
          if adb shell run-as "$PACKAGE_ID" test -f "$APP_DEBUG_LOG"; then
            adb exec-out run-as "$PACKAGE_ID" cat "$APP_DEBUG_LOG" \
              > "$RESULTS_DIR/app-debug.log" || true
          else
            echo "The app debug log was not found at $APP_DEBUG_LOG." \
              > "$RESULTS_DIR/app-debug.log"
            echo >> "$RESULTS_DIR/app-debug.log"
            echo "Note: run-as failed or the app is not debuggable. For this smoke test build the APK as Debug to permit run-as access." \
              >> "$RESULTS_DIR/app-debug.log"
            echo >> "$RESULTS_DIR/app-debug.log"
            echo "Files available in the app's private files directory:" \
              >> "$RESULTS_DIR/app-debug.log"
            adb shell run-as "$PACKAGE_ID" find files -maxdepth 3 -type f -print \
              >> "$RESULTS_DIR/app-debug.log" 2>&1 || true
          fi

          echo "Checking whether the app is still the foreground activity..."
          RESUMED_ACTIVITY="$(adb shell dumpsys activity activities 2>/dev/null \
            | egrep -m 1 'mResumedActivity|mFocusedApp|mCurrentFocus' || true)"

          echo "$RESUMED_ACTIVITY" | tee "$RESULTS_DIR/resumed-activity.txt"

          if ! echo "$RESUMED_ACTIVITY" | grep -q "$PACKAGE_ID"; then
            echo "::error::The shopping app did not remain open after launch."
            echo "Recent Android runtime output:"
            grep -E -i \
              'FATAL EXCEPTION|AndroidRuntime|shoppingapp|shopping_app' \
              "$RESULTS_DIR/logcat.txt" | tail -n 250 || true
            exit 1
          fi

          echo "Shopping app launched and remained in the foreground."
          SCRIPT

          chmod +x "$RUNNER_TEMP/android-emulator-smoke-test.sh"

      - name: Boot emulator, install app, and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "$RUNNER_TEMP/android-emulator-smoke-test.sh" "$APK_PATH"

      - name: Upload emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-test-results
          path: android-emulator-results/
          if-no-files-found: warn
          retention-days: 14
