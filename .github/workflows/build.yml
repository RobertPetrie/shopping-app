name: Build Shopping App

on:
  push:
    branches: [main]
    # Workflow-only maintenance should not spend build minutes.
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    # A pull request that only changes workflow files does not need the app build.
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    name: Run unit tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Run unit tests
        run: >
          dotnet test ShoppingApp.Tests/ShoppingApp.Tests.csproj
          --configuration Release
          --framework net10.0


  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore dependencies
        run: >
          dotnet restore shopping-app.csproj
          --runtime win-x64
          -p:Configuration=Release
          -p:TargetFrameworks=net10.0-windows10.0.19041.0

      - name: Build Windows app
        run: >
          dotnet build shopping-app.csproj
          --configuration Release
          --framework net10.0-windows10.0.19041.0
          --runtime win-x64
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
          --no-restore


  # A merge/push to main is not considered healthy until the Android app
  # has actually installed and stayed open in an emulator. Keep this off
  # pull requests and manual Build Shopping App runs to avoid extra minutes.
  android-emulator:
    name: Android emulator smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build-windows]
    uses: ./.github/workflows/android-emulator-smoke-test.yml
